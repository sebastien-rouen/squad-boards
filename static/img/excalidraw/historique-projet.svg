los en local</tspan></text><polyline points="1908,328 1910,328" fill="none" stroke="#9ca3af" stroke-width="2" stroke-opacity="0.8" marker-end="url(#arrowhead-9ca3af)"/><rect x="2230" y="140" width="290" height="376" rx="16" fill="#e0e7ff" fill-opacity="1.0" stroke="#3730a3" stroke-width="2" stroke-opacity="1.0"/><text font-family="'Patrick Hand', cursive" font-size="18" text-anchor="middle" fill="#1e1b4b" fill-opacity="1.0"><tspan x="2375.0" y="170.3">🗂️  Backlog UX avancé</tspan></text><text font-family="'Patrick Hand', cursive" font-size="13" text-anchor="middle" fill="#3730a3" fill-opacity="1.0"><tspan x="2375.0" y="209.05">9 — 11 juin  •  1 commit</tspan></text><polyline points="2245,222 2505,222" fill="none" stroke="#a5b4fc" stroke-width="1" stroke-opacity="1.0"/><text font-family="'Patrick Hand', cursive" font-size="13" text-anchor="start" fill="#1e1b4b" fill-opacity="1.0"><tspan x="2245" y="241.05">• Hash URL filtres (#backlog~h=epic)</tspan><tspan x="2245" y="257.3">  séparateur ~ (RFC 3986, jamais encodé)</tspan><tspan x="2245" y="273.55">• Hiérarchie Épics/Features</tspan><tspan x="2245" y="289.8">  3 modes : Plat / Épics / Complet</tspan><tspan x="2245" y="306.05">• Sprints futurs vides affichés</tspan><tspan x="2245" y="322.3">  filtrés par équipe sélectionnée</tspan><tspan x="2245" y="338.55">• Pill dates sprint + goal éditable</tspan><tspan x="2245" y="354.8">  inline (début/fin + textarea)</tspan><tspan x="2245" y="371.05">• Chips filtres actifs visibles</tspan><tspan x="2245" y="387.3">  sur les boutons (mini-tags bleus)</tspan></text><polyline points="2218,328 2218,328" fill="none" stroke="#9ca3af" stroke-width="2" stroke-opacity="1.0" marker-end="url(#arrowhead-9ca3af)"/><circle cx="2218" cy="328" r="5.0" fill="#9ca3af" fill-opacity="1.0"/></svg>